<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Résultats attendus</title>
     <link rel="icon" type="image/x-icon" href="images.ico">
    <link rel="stylesheet" href="style.css">
</head>

<body class="content-body">

    <div class="container animate-fade-in">

        <a href="index.html" class="back-link">← Accueil</a>

        <h1>Résultats attendus</h1>
        <p class="subtitle-white">Ce que vous pouvez obtenir après le tirage au sort</p>

        <div class="results-grid">

            <div class="result-card animate-slide-up">
                <div class="result-icon">🎯</div>
                <h3>Sélectionné</h3>
                <p>Vous êtes retenu pour participer au Hadj 2026.</p>
            </div>

            <div class="result-card animate-slide-up delay-1">
                <div class="result-icon">⏳</div>
                <h3>Liste d’attente</h3>
                <p>Vous êtes en attente selon le classement des tirages.</p>
            </div>

            <div class="result-card animate-slide-up delay-2">
                <div class="result-icon">❌</div>
                <h3>Non sélectionné</h3>
                <p>Vous pourrez retenter votre chance au prochain tirage.</p>
            </div>

        </div>

    </div>

</body>
</html>
